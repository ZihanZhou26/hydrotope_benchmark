claims:
  - id: s1_001
    status: verified
    by: student-1
    round: 1
    statement: >
      n=5 three-minus closed form (legs 1,2,3 minus; 4,5 plus), g general:
      $A_5 = i\,2^4 g^{-2}\,\omega_4\omega_5 \sum_{S\subseteq\{1,2,3\}}(-1)^{|S|}
      (\beta^2-\sum_{j\in S}\omega_j^2)_+^2$, with $\beta=\min(|\omega_4|,|\omega_5|)$,
      $(x)_+=\max(x,0)$. Purely imaginary; continuous, piecewise-homogeneous of degree 6;
      no poles. Independently re-derived via the plus/minus swap (question.md item 3) applied
      to the two-minus truncated-power law (item 2) with minus legs relabeled to {4,5}.
    evidence: >
      bots/student-1/code/verify_n5.py (own copy of bg.cpp): EXACT rational agreement at
      24/24 non-degenerate points (generic, fractional, non-generic w>>rest and w<<rest,
      all realizable chambers). Plus/minus swap invariance confirmed directly in --amp mode
      (flip K->-K leaves A_5 unchanged) at 4 points. Derivation: derivations/n5_derivation.md.
  - id: s1_002
    status: verified
    by: student-1
    round: 1
    statement: >
      Chamber decomposition of n=5 three-minus. With a=w1^2,b=w2^2,c=w3^2,
      m=beta^2=min(w4^2,w5^2), P=i*2^4*g^{-2}*w4*w5: a minus-subset S is "active" iff
      sum_{j in S} w_j^2 < m. The on-shell momentum law w4^2+w5^2=w1^2+w2^2+w3^2 (=:T) forces
      m<=T/2, which makes the triple S={1,2,3} ALWAYS inactive, allows AT MOST ONE active pair,
      and makes "all three singletons active" (chamber D) UNREALIZABLE. The only realizable
      chambers are A,B,C,E with closed forms:
      A (none active): F=A_5/P=m^2;  B (one single i): F=w_i^2(2m-w_i^2);
      C (two singles i,j, no pair): F=2m(w_i^2+w_j^2)-m^2-w_i^4-w_j^4;
      E (pair {i,j} active): F=2 w_i^2 w_j^2 (m cancels). A_5 is C^1 across every chamber wall
      (each (.)_+^2 term is C^1).
    evidence: >
      bots/student-1/code/verify_n5.py (per-chamber polynomial == full formula == oracle, exact,
      at off-wall reps A=(-1,-1,-1/2),B=(-1,-1,1/2),C=(-1,-1,-4/3),E=(-1,-1,-2)) and chamber
      sweep in walls_n5.py. Chamber D unrealizable: sup over manifold of
      [min(w4^2,w5^2)-max(w_i^2)] = 0 (attained only degenerately); >3e6-sample scan/optimization,
      max gap ~ -4e-5 < 0.
  - id: s1_003
    status: verified
    by: student-1
    round: 1
    statement: >
      The |k_S|=0 walls where bg.cpp divides by zero (SIGFPE exact / inf,nan in --double),
      k_S=sum_{i in S} sigma_i w_i^2 for subsets S of legs {2,3,4,5}, are SPURIOUS coordinate
      singularities of the Berends-Giele representation, NOT poles of A_5. On the three-minus
      n=5 manifold the non-degenerate ones reduce (via momentum conservation) to chamber walls:
      S={2,4}->w4^2=w2^2; {2,5}->w5^2=w2^2; {3,4}->w4^2=w3^2; {3,5}->w5^2=w3^2;
      {2,3,4}->w4^2=w2^2+w3^2 (<=> w5^2=w1^2); {2,3,5}->w5^2=w2^2+w3^2 (<=> w4^2=w1^2)
      (others force a vanishing frequency). A_5 is FINITE and C^1 there: one-sided limits from
      both sides converge to the formula value at the wall, linearly in eps with EQUAL slopes
      (no 1/eps term). Hence n=5 three-minus carries NO factorization pole (poles expected only
      at n>=6).
    evidence: >
      bots/student-1/code/walls_n5.py: exact-rational one-sided limits on the internal channel
      S={2,3,4} (Pythagorean 3,4,5; A_wall/i=-138240; residual ~ +/-2957*eps, slopes match) and
      on S={3,4}. Oracle confirmed to SIGFPE exactly on each wall.
  - id: s1_004
    status: verified
    by: student-1
    round: 2
    statement: >
      n=6 three-minus CHAMBER ARRANGEMENT. The mixed momentum-subset walls
      k_S=sum_{i in S} sigma_i omega_i^2=0 reduce to exactly two orbit types:
      (1=1) omega_i^2=omega_j^2 (i minus, j plus), 9 walls; and
      (1=2) omega_i^2=omega_j^2+omega_k^2 (i minus, {j,k} plus), 9 walls
      (equivalently omega_r^2=omega_p^2+omega_q^2 by complement k_S=-k_{S^c}).
      All other mixed subsets are sign-definite on-shell (no wall). A >=1.5e6-point
      exact manifold scan finds 336 distinct sign patterns of the 18 wall functions,
      grouping into 12 chamber TYPES under S_3(minus) x S_3(plus) x Z_2(swap); each
      type is realizable (interior rational point exhibited). NOTE: these mixed walls
      are NOT the full non-analyticity locus -- same-type comparisons
      (omega_i^2 vs omega_j^2 within a triple) also enter, as the n=5 'min' did.
    evidence: >
      bots/student-1/code/chambers_n6.py (enumeration + 1.5e6 scan -> 12 types, 336 raw;
      interior reps). Wall reduction proof in derivations/n6_chambers_and_rational_structure.md sec 2.
  - id: s1_005
    status: verified
    by: student-1
    round: 2
    statement: >
      CORRECTION TO THE ROUND-1 GATE: A_6 in the three-minus sector is piecewise-RATIONAL,
      NOT piecewise-polynomial. Rigorous: on a 1-D slice held inside ONE full chamber
      (mixed wall signs AND all six same-type orderings fixed -> a single analytic piece),
      A_6 * sumFree^p (sumFree=omega_2+omega_3+omega_4+omega_5) is NOT a polynomial of degree
      8+p for any p=1..12 (exact rational). Since the oracle eliminates legs 1,6 by a rational
      solve omega_1,omega_6=(deg-2 poly)/sumFree, a genuine degree-8 POLYNOMIAL in the six
      frequencies would force A_6*sumFree^8 to be polynomial (every monomial has
      power(omega_1)+power(omega_6)<=8). It is not -> A_6 is rational. Confirmed in 4 free
      variables too (700-point full-chamber modular fit: A_6*sumFree^p inconsistent with the
      degree-8+p monomial basis, p=1..6). The non-cancelling denominators are momentum
      magnitudes |k_S| from the BG kernels (they DO cancel at n=5, giving the polynomial
      two-minus / n=5 law; they do NOT at n=6). The surviving |k_S| are sums of squares
      (e.g. omega_4^2+omega_5^2), so they never vanish on the manifold -> A_6 is finite
      everywhere (round-1 'no poles' stands) but genuinely rational.
    evidence: >
      bots/student-1/code/verify_n6_rational.py (part A; full-chamber slice, p=1..12 all
      non-polynomial). CONTROL bots/student-1/code/n5_poly_control.py: the SAME test on n=5
      (known polynomial A_5=2^4 w4 w5 P(w^2)) correctly returns POLYNOMIAL at p=1, so the
      method is sound and the n=6 'no p works' is genuine rationality, not a test artifact.
      bots/student-1/code/{findp_slice.py,rationalfit.py,symslice.py} (slice rational fits;
      symslice gives the exact uncancelled BG denominator, a large product of |k_S|/D_S
      factors). Multivariate confirmation: 700-pt full-chamber modular fit (modfit.py).
  - id: s1_006
    status: verified
    by: student-1
    round: 2
    statement: >
      NO PHYSICAL factorization poles (consistent with round-1, against question.md's
      pole conjecture). Driving onto factorization channels D_S=omega_S^2/|k_S|-g -> 0,
      A_6 stays finite with A_6*D_S -> 0 (residue cancels), INCLUDING the channel
      S={2,4,5} (one minus + two plus, k_S>0) for which the naive factorization argument
      predicts a two-minus x two-minus (both nonzero) residue and hence a pole. It is
      still removable: A_6/i -> 3039 finite, A_6*D_245 -> 0 linearly. The naive
      'every split forces a one-minus subamp' argument is INCORRECT for 3-minus (a 2+1
      split gives two-minus on both sides via the internal line), yet the n=4 sub-amplitude
      residues still cancel on-shell. So the rational A_6 has NO zeros of its reduced
      denominator on the physical manifold.
    evidence: >
      bots/student-1/code/{verify_n6_rational.py (part B), polehunt.py}: S={2,4,5} channel
      driven from both sides, A_6 finite, A_6*D_S -> 0.
  - id: s1_007
    status: verified
    by: student-1
    round: 2
    statement: >
      ANSATZ RULING-OUTS for the n=6 closed form. (i) Double-subset resonance spline
      sum_{S subseteq M, T subseteq P} (-1)^{|S|+|T|} (sum_T omega^2 - sum_S omega^2)_+^p
      is impossible: the only degree-8 member (p=4) is identically ZERO (over-differenced:
      order-3 x order-3 difference annihilates a quartic), and p=3 gives a nonzero deg-6
      object B_3 but A_6 != (deg-2 poly)*B_3 (exact, per chamber). The n=5 amplitude is
      itself NOT a double-subset spline (its threshold is the asymmetric min). (ii) A_6/i
      is NOT a polynomial in {omega_i^2}, nor in {omega_i^2, S}, nor in {omega_i^2,S,prod omega}
      per raw chamber (S=(sum_M omega)^2=(sum_P omega)^2) -- consistent with s1_005 (it is
      not polynomial at all). CONCLUSION: the closed form must be RATIONAL; build it as
      i*2^5 g^-3 * N(omega)/prod_{S} |k_S| with N piecewise-polynomial on the
      mixed-union-same-type arrangement.
    evidence: >
      bots/student-1/code/{verify_n6_rational.py (part C), cand.py, rawfit.py, modfit.py}.
      DS(p=4)=0 at every tested point; ratio/consistency tests fail for all polynomial ansaetze.
  - id: s1_008
    status: verified
    by: student-1
    round: 3
    statement: >
      EXPLICIT RATIONAL DENOMINATOR of n=6 three-minus. A_6 = i*2^5*g^{-3} *
      N(omega) / D9(omega), where D9 = prod_{i in {1,2,3}} prod_{j in {4,5,6}}
      (omega_i + omega_j) is the product of the NINE mixed-pair LINEAR forms
      (minus leg i + plus leg j), degree 9, and N = A_6*D9/(i 2^5 g^-3) is a
      piecewise POLYNOMIAL (a spline) of degree 2n-4 + 9 = 17. D9 is invariant
      under S_3(minus) x S_3(plus) x Z_2(swap), so N inherits the full symmetry.
      This makes s1_005 fully explicit and UNIFIES it with the team's spline
      program: the box-spline / multivariate-B-spline (student-2 s2_008, PI degree
      law) lives in the NUMERATOR N, not in A_6 itself. Only the SUM branch
      (omega_i+omega_j) appears; the difference branch omega_i-omega_j of the
      squared wall k_{ij}=omega_j^2-omega_i^2 is absent. Origin (bg.cpp): FKernel
      divides by momentum magnitudes |k_B|; the surviving ones cancel for n<=5 but
      not n=6 -> rational. At n=5 the analogous denominator divides N_5 (the n=5
      law is polynomial), recovering item 2 / s1_001.
    evidence: >
      bots/student-1/code/verify_denominator.py (one command): (A) A_6*sumFree^8 =
      N(t)/[(5t+8)(10t+53)/424], deg D=2 != 0 -> rational, with the n=5 POLYNOMIAL
      control; (B) A_6*D9 reconstructs to N(t)/sumFree^k (PURE power of the leg-1,6
      solve artifact, NO other factor) at 5-6 distinct chamber types x 2 slice
      directions -> A_6*D9 is a genuine 6-variable polynomial. Discovery via exact
      rational-function (Pade-over-Q) reconstruction: rat_denom.py, multislice.py
      (factors = mixed-pair sums = perfect matchings of the two triples),
      test_D9_global.py. Denominator origin from bg.cpp FKernel/Propagator analysis
      in derivations/n6_rational_denominator.md.
  - id: s1_009
    status: verified
    by: student-1
    round: 3
    statement: >
      STRUCTURAL RECONCILIATION of "rational" with "no poles". Each chamber's
      rational form N_c/D_c has its denominator zeros on perfect-matching walls
      (omega_i+omega_j=0) that lie OUTSIDE that chamber (shielded by chamber
      boundaries). So A_6 is finite on the entire physical manifold (no
      factorization poles, consistent with s1_006 / s2_002) yet genuinely rational
      -- no contradiction. The round-1 "gate" error was the inference
      finite => polynomial; a rational function with all poles shielded is finite
      everywhere but not polynomial. A perfect-matching locus
      {omega_i+omega_{sigma(i)}=0 for a bijection sigma: minus->plus} is codim-1 on
      the manifold (the two conservation laws are automatically satisfied there);
      there are 3!=6 such walls, two using the (omega_1,omega_6) pair
      (= -sumFree).
    evidence: >
      bots/student-1/code/probe_pole.py: the reference-chamber reconstructed form
      has a denominator root at t=-8/5 (omega_3+omega_4=0), but the kinematics cross
      a chamber wall near t=-1.5 first; the physical A_6 at t=-8/5 is finite
      (A_6/i ~ 5436), computed from the neighbouring chamber. multislice.py: every
      denominator root coincides with a full perfect matching.
