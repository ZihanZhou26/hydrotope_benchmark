  - id: s1_015
    status: verified
    by: student-1
    round: 5
    statement: >
      EXPLICIT (1=2) JUMP COEFFICIENT Q (the cubic-kink coefficient across the (1=2) wall
      a_i = b_j + b_k, i.e. omega_i^2 = omega_j^2 + omega_k^2). For minus leg i, plus pair
      {j,k}, excluded plus l, other two minus {p,q}, with A1=omega_p+omega_q, A2=omega_p*omega_q,
      B1=omega_j+omega_k, B2=omega_j*omega_k, y=omega_l (a representative modulo the on-shell
      ideal; omega_i absent in this gauge):
      $Q = A_2 B_1 (y^2 - A_1^2 - A_1 B_1 + A_2 - B_2) + B_2 y (A_2 - B_1 y - B_2)$
      $= -A_1^2 A_2 B_1 - A_1 A_2 B_1^2 + A_2^2 B_1 - A_2 B_1 B_2 + A_2 B_1 y^2 + A_2 B_2 y
      - B_1 B_2 y^2 - B_2^2 y.$
      Degree 5, odd under omega->-omega. The (1=2) jump of N is N_+ - N_- = (k_ijk)^3 Q_ijk
      with k_ijk = a_i - b_j - b_k. This is a CHAMBER-INDEPENDENT (clean) truncated power: the
      (1=2) sector of the simple form IS valid (only the (1=1) sector fails, s1_014).
    evidence: >
      bots/student-1/code/r5_getQ.py: extracted by exact reconstruction of single-(1=2)-wall
      jumps on many F-const slices relabelled to the reference wall; deg-5 H'-symmetric fit
      rank 34, fully consistent + held-out, 0/55 exact mismatches. GLOBAL check
      bots/student-1/code/{r5_corr.py,r5_verify.py}: M = N - sum_{(1=2)}(k_ijk)_+^3 Q_ijk is
      exactly (1=2)-SMOOTH (jump=0) at 10/10 (1=2) walls across >=4 chamber types.
      Independent evaluator bots/student-1/code/pybg.py (faithful Python BG port == ./bg at
      n=5,6,7) cross-checks N. Derivation: derivations/n6_round5_boxspline_and_Q.md sec 3.

  - id: s1_016
    status: verified
    by: student-1
    round: 5
    statement: >
      The box-spline CROSS-TERMS (s1_014) are carried by the perfect-MATCHING geometry on the
      DIFFERENCE branch. On the resonant manifold, two difference-branch (1=1) walls force a
      third: a_2=b_4 and a_3=b_5 imply a_1=b_6 (since sum sigma omega^2 = 0 makes
      omega_1^2 = omega_6^2 once omega_2^2=omega_4^2, omega_3^2=omega_5^2). Hence the (1=1)
      walls omega_i=omega_{sigma(i)} (sigma: minus->plus a bijection) intersect simultaneously
