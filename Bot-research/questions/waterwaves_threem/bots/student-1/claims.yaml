  - id: s1_011
    status: verified
    by: student-1
    round: 4
    statement: >
      DENOMINATOR IDENTITY (proven). On the three-minus n=6 resonant manifold the nine
      mixed-pair linear factors collapse to a perfect cube of a SINGLE cubic invariant:
      $\prod_{i\in\{1,2,3\}}\prod_{j\in\{4,5,6\}}(\omega_i+\omega_j) =
      (\omega_1\omega_2\omega_3+\omega_4\omega_5\omega_6)^3 = (e_3^-+e_3^+)^3$.
      PROOF: the two conservation laws give e1minus=-e1plus and e2minus=e2plus, so the
      minus cubic p_-(x)=prod_i(x-omega_i) and the plus sum-cubic Q(x)=prod_j(x+omega_j)
      share all coefficients except the constant term: Q(x)-p_-(x)=e3m+e3p (constant).
      Hence Q(omega_i)=e3m+e3p for every minus root, and D9=prod_i Q(omega_i)=(e3m+e3p)^3.
      Corollary (explains s2_011's 'entangled matching poles'): {D9=0}={e3m+e3p=0} is a
      SINGLE irreducible codim-1 hypersurface = the perfect-matching locus (one mixed
      pair vanishing forces a full matching), NOT 9 independent walls.
    evidence: >
      bots/student-1/code/inv.py (sympy resultant sp.resultant(p_-,Q)=(e3m+e3p)^3, plus
      8/8 random exact points D9==(e3m+e3p)^3). verify_min_denom.py part (P).
      Derivation: derivations/n6_minimal_denominator_and_jumps.md sec 2.

  - id: s1_012
    status: verified
    by: student-1
    round: 4
    statement: >
      MINIMAL DENOMINATOR (corrects s2_010 / PI post_009 'D9 minimal'). The minimal
      denominator of A_6 on the manifold is the SINGLE cubic to the FIRST power:
      $A_6 = i\,2^5 g^{-3}\,N(\omega)/(\omega_1\omega_2\omega_3+\omega_4\omega_5\omega_6)$,
      with N a piecewise-polynomial (spline) of degree 2n-4+3 = 11 (NOT 17),
      S_3(minus) x S_3(plus) x Z_2-symmetric and ODD under omega->-omega. D9 (degree 9)
      is a correct but NON-minimal denominator: on the manifold D9=(e3m+e3p)^3 (s1_011),
      so it over-clears by (e3m+e3p)^2; the team's degree-17 numerator equals my degree-11
      N times (e3m+e3p)^2. The 'D9 minimal' argument was valid in the FREE 6-variable
      polynomial ring (the S3xS3 orbit of one linear factor is all nine) but not in the
      coordinate ring of the manifold, where those nine factors are dependent
      ((e3m+e3p)^3) and A_6 has only a SIMPLE pole at e3m+e3p=0.
    evidence: >
      bots/student-1/code/verify_min_denom.py: (A) A_6*(e3m+e3p) reconstructs to a
      PURE-sumFree denominator (=> genuine 6-freq polynomial) on 8 slices across 4 chamber
      types; (D) the (e3m+e3p)-numerator factor has multiplicity exactly 1 in the reduced
      denominator of A_6(t) (pole order 1), with A_6-not-polynomial (team result) giving
      order >= 1. pole_order2.py/pole_order3.py (multiplicity 1 on reliable slices).

  - id: s1_013
    status: verified
    by: student-1
    round: 4
    statement: >
      SPLINE JUMP STRUCTURE of N (hence A_6). N kinks only across the MIXED walls (same-type
      orderings omega_4=omega_5 are analytic). The two wall orbits have DIFFERENT jump
      exponents (exact, clean single-wall crossings): (1=1) wall omega_i=omega_j (i minus,
      j plus): jump N_A-N_B is proportional to (k_ij)^1, k_ij=omega_j^2-omega_i^2 -> A_6 is
      C^0 there (first-derivative kink); (1=2) wall omega_i^2=omega_j^2+omega_k^2: jump is
      proportional to (k_ijk)^3, k_ijk=omega_i^2-omega_j^2-omega_k^2 -> A_6 is C^2 (cubic
      kink). This CONFIRMS the team's (1=2) 'cubic kink' (s2_004) and PINS both exponents.
      Unlike n=5 (uniform exponent n-3=2 everywhere), n=6 exponents SPLIT (1 and 3), which
      rules out a single-exponent truncated-power/box-spline ansatz for N. The (1=1) kink
      lives on the DIFFERENCE branch (omega_i-omega_j) while the denominator is the SUM
      branch (omega_i+omega_j): the two roots of the BG kernel |k_ij|=|omega_i-omega_j||omega_i+omega_j|.
      Reduction: A_6 is a single-valued spline in the 4 invariants (e1,e2,e3m,e3p) with
      Z_2 acting as (e1,e2,e3m,e3p)->(-e1,e2,e3p,e3m).
    evidence: >
      bots/student-1/code/jumps_smoothness.py (fixed clean crossings: (1=1) base
      (w2,w3,w4,w5)=(3,5/2,*,53/10) vary w4 across 3 -> jump order 1; (1=2) base
      (6,-87/10,*,3) vary w4 across w4^2=27 -> jump order 3, exact rational). The
      unclean (multi-wall, sign-diff=2) crossing falsely showed order 1 -- single-wall
      (sign-diff=1) crossings are essential. Derivation: n6_minimal_denominator_and_jumps.md sec 4.

  - id: s1_014
    status: verified
    by: student-1
    round: 5
    statement: >
      CORRECTS THE ROUND-5 TASK PREMISE: the numerator N_6 is a GENUINE BOX SPLINE, NOT a
      simple single-wall truncated-power sum. The ansatz
      N = B + sum_{(1=1)} (k_ij)_+^1 P_ij + sum_{(1=2)} (k_ijk)_+^3 Q_ijk (PI round-5 task)
