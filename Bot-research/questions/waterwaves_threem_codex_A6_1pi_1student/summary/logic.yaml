    FRESH bg_r8 on $40/40$ in-piece pts each. So A/B compress to FOUR rational blocks, each with a
    SINGLE simple denominator ($B_P$; $u(u+r)(u+s)B_M$; $uL$; $v(u+r)(u+s)$) — a signed-channel seed.
  nogo_confirmed: >
    [pi_v_027] PI CONFIRMED student s1_021 by substantiating its sub-fact from the four-block form
    directly: reduced $H_A$ has $\gcd(P,Q)=1$, homogeneous $\deg N=12$, $\deg Q_{\rm hom}=10$ factoring
