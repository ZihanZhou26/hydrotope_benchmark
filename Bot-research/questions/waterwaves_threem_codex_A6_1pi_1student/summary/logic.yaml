problem:
  goal: >
    Find a genuinely human-readable closed-form analytic formula for the
    tree-level six-point on-shell amplitude $A_6(\omega_1,\dots,\omega_6)$ for
    1D deep-water surface waves in the three-minus sector
    $\sigma=(-1,-1,-1,+1,+1,+1)$ (minus legs $1,2,3$; plus legs $4,5,6$).
  dispersion: "$\\omega_i^2=g|k_i|$, so $k_i=\\sigma_i\\,\\omega_i^2/g$."
  on_shell: "$\\sum_i\\omega_i=0$ and $\\sum_i\\sigma_i\\omega_i^2=0$ (all incoming). Frequencies are SIGNED."
  not_accepted:
    - "Stored chamber polynomials / large coefficient table / flag-by-flag lookup."
    - "Divided-difference / residue notation that still hides a table or lookup."
  accepted_shape: >
    Numerator built from a small set of defined building blocks / finite orbit sums /
    positive-part terms; evaluator reconstructs $A_6$ WITHOUT a chamber coefficient table.

coordinates:
  common_cubic: >
    [pi_v_010] $u_i=-\omega_i$ (minus), $v_j=\omega_{3+j}$ (plus). Conservation forces
    $e_1(u)=e_1(v)=s$, $e_2(u)=e_2(v)=p$; differ only in $e_3$: $r=\prod u_i$, $t=\prod v_j$.
  squares: "$a_i=\\omega_i^2$ (minus), $b_j=\\omega_{3+j}^2$ (plus), $T=\\sum a_i=\\sum b_j$."
  chart: >
    bg free coords $f=(\omega_2,\omega_3,\omega_4,\omega_5)$; $\omega_1,\omega_6$ solved. In
    round 6 dehomogenize by $\omega_2$: $x=\omega_3/\omega_2,y=\omega_4/\omega_2,z=\omega_5/\omega_2$.

