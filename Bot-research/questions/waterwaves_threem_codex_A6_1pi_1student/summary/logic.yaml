round6_headline:
  breakthrough: >
    [pi_v_021] EXACT in-piece reconstruction. A true piece is a CONE (H and all 53 surfaces
    homogeneous), so dehomogenizing by $\omega_2$ makes $h=H/\omega_2^2$ a rational function of
    only 3 vars $(x,y,z)$. A modular null-space fit + 5-prime CRT reconstruction gives, verified
    EXACTLY (Fraction) 1000/1000 pts in TWO independent true pieces vs fresh bg_r6:
    $H=P/Q$ with a degree-10 (homogeneous) denominator that FACTORS.
  factored_denominator: >
    [pi_v_021] Piece A: $Q_A\propto x(x+y)(x+z)(y+1)(z+1)Q_aQ_b$;
    Piece B: $Q_B\propto y z(x+y)(x+z)(y+1)(z+1)Q_aQ_b$, with the SAME quadratics
    $Q_a=x^2+xy+xz+x+yz+y+z+1$, $Q_b=xy+xz+x+y^2+yz+y+z^2+z$. Homogenized (free legs 2,3 minus;
    4,5 plus): single legs $\omega_i$, mixed pair sums $\omega_i+\omega_j$, and
    $Q_a=e_2(\omega_{2..5})+\omega_2^2+\omega_3^2$, $Q_b=e_2+\omega_4^2+\omega_5^2$.
    The four mixed-pair factors and $Q_a,Q_b$ are CHART-UNIVERSAL (identical A,B); only the
    SINGLE-LEG product is CHAMBER-DEPENDENT (A:$\{\omega_3\}$, B:$\{\omega_4,\omega_5\}$).
  quadratic_identity: >
    [pi_v_021, symbolic] For $S=\{2,3,4,5\}=\{1,6\}^c$: $Q_a+Q_b=\omega_S^2$ and
    $4Q_aQ_b=\omega_S^4-k_S^2=h_S(\omega_S^2+|k_S|)$. So $Q_a,Q_b$ are the two sign-branches of
    the complementary internal-line inverse propagator $h_{2345}$; the removable $h_S$ sits IN Q
    and the numerator $P$ supplies the compensating zero (pi_v_006 made explicit).
  resolves_round5: >
    [pi_v_021] The denominator blocks are SIGNED (single legs, mixed pair sums, $Q_a,Q_b$). Every
    excluded family (s1_015, pi_v_017, pi_v_019) used EVEN blocks ($a_i\pm b_j,a_i+a_j,T,p,
    \omega_i\omega_j$) — wrong parity, so none could clear $H$. The single-$Q$ picture was searched
    in the wrong ring, not dead. s1_017 confirmed SOUND [pi_v_022] and explained by this root cause.

