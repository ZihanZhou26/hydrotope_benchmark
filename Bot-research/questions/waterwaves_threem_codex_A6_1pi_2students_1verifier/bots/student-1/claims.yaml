claims:
  - id: s1_001
    timestamp: "2026-07-26T05:55:42"
    status: verified_negative
    claim: >
      The proposed symmetric minus-pair truncated-cubic ansatz for $A_6$ is
      false for every $(e_m,e_p)\in\{\pm1\}^2$, both with one common pair
      coefficient and with three labeled pair coefficients.  The combined
      symmetry-orbit fallback with both min/max thresholds, all four sign
      choices, and nine homogeneous degree-two prefactors is also exactly
      inconsistent: on 40 exact training points its deduplicated feature
      matrix has $\operatorname{rank}A=14$ but
      $\operatorname{rank}[A|y]=15$.
    evidence:
      - bots/student-1/derivations/s1_001_h1_rejection.md
      - bots/student-1/derivations/h1_fit_report.md
      - bots/student-1/data/h1_results.json
      - bots/student-1/data/exact_samples.json
      - bots/student-1/code/h1_batch.py
    verification: >
      Fresh exact GMP BG at 80 nondegenerate rational on-shell points spanning
      15 subset-sign signatures; two supplied six-point anchors exact; an
      independent two-point $e_m=e_p=+1$ contradiction has residual
      $507828301824/85\neq0$; exact five-point calibration gives
      $A_5=-19968\,i$ on both BG and the sign-flipped two-minus formula.

  - id: s1_002
    timestamp: "2026-07-26T05:55:42"
    status: literature_verified
    claim: >
      The 2026 hydrotope paper is the direct source of the two-minus
      truncated-power formula and explicitly leaves the three-minus sector,
      which first becomes independent at six points, to future work.  Its
      two-minus no-pole uniqueness argument therefore does not justify a pure
      hydrotope sum for $A_6^{---+++}$.
    evidence:
      - bots/student-1/derivations/literature_notes.md
    sources:
      - https://arxiv.org/abs/2606.28280
      - https://arxiv.org/abs/1903.10854

  - id: s1_003
    timestamp: "2026-07-26T07:27:29"
    verified_at: "2026-07-26T07:42:15"
    status: verified_exact_denominator_part
    claim: >
      Direct BG propagator normalization gives the compact pole part
      $P_{\mathrm{pole}}=\sum_{T:Q_T>0}Q_T h_{4,L}h_{4,R}/d_T$, where both
      $h_4$ factors are the known stripped two-minus four-point amplitude,
      the complementary factor is written after a global momentum-sign flip,
      and the auxiliary internal-frequency branch cancels.  This orbit sum
      reproduces the principal part at every nonzero-residue BG propagator;
      subtracting it leaves a chamber polynomial.  Exact diagnostics find no
      residual $\Delta$ denominator on 80 GMP samples.
    evidence:
      - bots/student-1/derivations/s1_003_pole_part.md
      - bots/student-1/derivations/pole_batch_report.md
      - bots/student-1/data/pole_results.json
      - bots/student-1/code/pole_batch.py
    verification: >
      Algebraic factorization from the exact Propagator implementation in
      bg.cpp.  After a clean rebuild, 77 fresh exact BG evaluations spanning
      four sorted words and fifteen full signatures gave integral residual on
      16/16 integer points and integral $L^8$-scaled residual on 61/61 rational
      points.  The degree-six no-$Q_T$ control failed on 3/16 integer and 24/61
      rational points.  At $\omega=(-8,2,3,4,5,-6)$,
      $P_{\mathrm{pole}}=42588288/7$ and the residual is $-7396992$.

  - id: s1_004
    timestamp: "2026-07-26T10:05:10"
    status: verified_exact_obstruction
    claim: >
      The degree-six pair-wall coefficient $H_{mp}$ is itself a nested
      spline, not one global polynomial.  On the exact $q_{24}$ wall slice
      $B=10$, $c=u$, $e=6-u$, a seven-point branch reconstruction plus two
      same-cell holdouts gives an explicit degree-six polynomial $P(u)$.
      After $Q_{3;\{4,5\}}=61-12u$ changes sign, five exact tests instead
      give $H_{24}(u)=P(6-u)\neq P(u)$.  The simpler regular ansatz formed
      from a global symmetric polynomial plus one orbit of products of the
      two known $A_4$ hydrotope blocks is also exactly inconsistent, as is
      its eight-prefactor side-symmetric extension.
    evidence:
      - bots/student-1/derivations/s1_004_nested_wall_obstruction.md
      - bots/student-1/data/round3_wall_brick.json
      - bots/student-1/data/round3_nested_results.json
      - bots/student-1/derivations/round3_nested_raw_report.md
      - bots/student-1/code/round3_wall_brick.py
      - bots/student-1/code/round3_nested.py
    verification: >
      Every $H_{24}$ value was obtained from two off-wall exact BG branch
      continuations (nine fit points and two holdouts per side), never by
      evaluating BG on a wall.  The known anchor is reproduced exactly:
      $H_{24}(10,2,3)=12622720/27$.  The affine-line single-polynomial
      branch has two zero same-cell holdouts; all five tests beyond the
      coupled $Q_{3;\{4,5\}}$ subdivision equal the exchanged branch
      $P(6-u)$ exactly.  Separately, 200 orbit-inequivalent exact points
      spanning eight sorted words, 61 signatures, and 32 nine-$Q$ patterns
      give rank obstructions $13<14$ and $17<18$ for the one-block and
      eight-prefactor nested candidates.

  - id: s1_005
    timestamp: "2026-07-26T12:42:58"
    status: verified_exact_obstruction
    claim: >
      The two compact off-wall $H_{mp}$ pieces classified only by whether
      the four-leg minimizer is a minus or plus leg do not globally determine
      $R_{\mathrm{spline}}$.  Their oriented $q_{mp}H_{mp}$ transport is
      path-independent on the connected graph of all eight realized sorted
      words, but after transport no dual-$S_3$ degree-eight reference
      polynomial exists: the exact system has
      $\operatorname{rank}A=17<18=\operatorname{rank}[A|R_0]$.  A unique
      17-point polynomial fit fails all $303/303$ remaining exact samples.
      The direct truncated-min orbit
      $-32\sum_{m,p}(q_{mp})_+\beta_{mp}^2G_m$ fails by the same
      $17<18$ obstruction and $303/303$ raw residuals.
    evidence:
      - bots/student-1/derivations/s1_005_sorted_transport_obstruction.md
      - bots/student-1/data/round4_sorted_transport.json
      - bots/student-1/derivations/round4_sorted_transport_raw_report.md
      - bots/student-1/code/round4_sorted_transport.py
      - bots/student-1/bg_round4.cpp
    verification: >
      Fresh exact GMP build with SHA-256
      `bd1afe67c45e1e9403c03a0b78373ebb492235be56fc1e5ee9281cbbec9040c1`;
      320 exact nondegenerate samples covering all eight realized words;
      full-rank 17-dimensional on-shell dual-symmetric basis; independent
