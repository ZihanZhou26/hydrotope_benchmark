  - id: s1_006
    timestamp: "2026-07-26T14:52:36"
    status: verified_kinematic_enumeration
    claim: >
      Away from external soft limits, every subset-momentum chamber wall in
      the six-point three-minus sector belongs to exactly one of two
      $S_3(M)\times S_3(P)$ orbits: the nine pair walls
      $q_{mp}=\omega_p^2-\omega_m^2=0$ and the nine triple walls
      $Q_{m;pq}=\omega_p^2+\omega_q^2-\omega_m^2=0$.  This follows by
      classifying a subset by its minus/plus cardinalities, quotienting by
      $k_S=-k_{S^c}$, and excluding same-sector sums of strictly positive
      squares.  The public 2026 hydrotope paper contains no three-minus
      crossing rule: it explicitly defers this sector to a hydrohedron work
      still listed only as “to appear,” and the linked repository contains
      only a numerical BG evaluator.
    evidence:
      - bots/student-1/derivations/s1_006_wallset_and_literature.md
    sources:
      - https://arxiv.org/abs/2606.28280
      - https://github.com/ZihanZhou26/Hydrotope
    verification: >
      Exhaustive analytic classification of all subset types
      $(a,b)=(|S\cap M|,|S\cap P|)$ modulo
      $(a,b)\leftrightarrow(3-a,3-b)$.  The empirical single-degree-eight-
      polynomial-per-open-component test is a separate pending check and is
      not claimed by this entry.

  - id: s1_007
    timestamp: "2026-07-26T14:57:37"
    status: verified_exact_wall_completeness
    claim: >
      The pole-subtracted remainder is one homogeneous degree-eight
      polynomial on each tested open component of the joint 18-wall fan.
      Eight distinct full signatures fixing all six energy signs, all nine
      $q_{mp}$ signs, and all nine $Q_{m;pq}$ signs were reconstructed in
      the 285-dimensional on-shell quotient basis.  Every exact solve had
      rank 285 and zero residual, and all $160/160$ fresh exact holdouts
      vanished.  Together with the exhaustive subset-cardinality
      enumeration in `s1_006`, this confirms that no additional non-soft
      subset-momentum wall orbit is missing.
    evidence:
      - bots/student-1/derivations/s1_007_joint_chamber_polynomial_audit.md
      - bots/student-2/data/round3_context_a.json
      - bots/student-2/data/round3_context_b.json
      - bots/student-2/data/round3_context_c.json
      - bots/student-2/data/round3_context_d.json
    verification: >
      Independent raw-record audit checked eight pairwise-distinct
      24-sign vectors, rank 285 and exact solve status on every branch, and
      every stored holdout residual.  The per-branch counts are eight times
      $20/20$, totaling $160/160$ exact zero residuals.  The coefficient
      arrays are used only as diagnostics, not as a candidate formula.

  - id: s1_008
    timestamp: "2026-07-26T17:44:23"
    status: verified_exact_obstruction
    claim: >
      After using the settled degree-eight $P_{\rm pole}$ and subtracting
      the confirmed
      $R_Q=-32\sum_{m,p<q}(Q_{m;pq})_+^3\omega_m\omega_t$, neither previous
      order-one $q$-wall assembly leaves a global dual-$S_3$ degree-eight
      polynomial $R_0$.  Both the two-$\beta$-type path transport and the
      direct compact orbit
      $T=-32\sum_{m,p}(q_{mp})_+\beta_{mp}^2G_m$ give
      $\operatorname{rank}A=17<18=\operatorname{rank}[A|y]$.  Thus the
      hypothesis that the omitted $R_Q$ alone caused the old defect is
      false, and the compact $R_q$ remains missing.
    evidence:
      - bots/student-1/derivations/s1_008_corrected_joint_assembly_obstruction.md
      - bots/student-1/data/round6_assembly.json
      - bots/student-1/data/round6_assembly_selfcheck.json
      - bots/student-1/code/round6_assembly.py
      - bots/student-1/bg_round6.cpp
    verification: >
      A fresh exact-GMP build evaluated 550 generic points spanning all eight
      realized magnitude words and 113 distinct full chamber signatures.
      Both exact 160-row systems and both full systems had ranks $17<18$;
      a 17-point interpolation for either target failed every remaining
      $533/533$ point.  Zero path-cycle disagreements were found.  An
      independent rerun reproduced all headline metrics and the exact anchor
      $A_6/i=-9190656/7$, $P_{\rm pole}=42588288/7$,
      $R_{\rm spline}=-7396992$.  An earlier technician output using the
      degree-six negative control $S_0$ was invalidated and overwritten.

  - id: s1_009
    timestamp: "2026-07-26T20:23:18"
