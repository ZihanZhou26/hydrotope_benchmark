  - id: s1_010
    timestamp: "2026-07-26T23:31:11"
    status: verified_exact_candidate
    claim: >
      The complete 605-column top-down system is exactly consistent:
      on 900 exact rows spanning all eight realized magnitude words,
      $\operatorname{rank}A=\operatorname{rank}[A|S]=182$ at each of
      three primes.  Exact recovery and stabilizer reduction give the
      table-free formula
      $S=R_0+R_q$, where
      $R_q=4\sum_{m,p}(q_{mp})_+H_1+
      2\sum_{m,p,\phi}(q_{r,\phi(r)})_+
      (q_{s,\phi(s)})_+H_2$ and
      $R_0=H_0(u,v,e_-,e_+)$.  The explicit polynomials
      $H_1,H_2,H_0$ contain respectively 46, 23, and 13 monomials.
      Combined with the settled $P_{\rm pole}$ and $R_Q$, this gives the
      complete candidate
      $A_6=i g^{-3}(P_{\rm pole}+R_Q+R_0+R_q)$ with all chamber choices
      encoded by positive parts and all genuine poles confined to
      $P_{\rm pole}$.
    evidence:
      - bots/student-1/derivations/s1_010_round8_compact_hinge_candidate.md
      - bots/student-1/code/round8_compact_candidate.py
      - bots/student-1/data/round8_decisive_result.json
      - bots/student-1/data/round8_hinge_decisive_diag.json
