goal:
  statement: >
    Compact analytic closed form for $A_6(\omega_1,\dots,\omega_6)$ in the sector
    $\sigma=(-1,-1,-1,+1,+1,+1)$, valid for arbitrary nondegenerate on-shell kinematics, with
    explicit chamber-selection and pole prescription, displayable from a few defined analytic
    building blocks (NOT a stored chamber table), with a table-free evaluator. ACHIEVED.
  on_shell_manifold:
    - "$\\sum_{i=1}^{6}\\omega_i=0$"
    - "$\\sum_i\\sigma_i\\omega_i^2=0$ (so $\\sum_{p\\in P}\\omega_p^2=\\sum_{m\\in M}\\omega_m^2$)"
  momenta: "$k_i=\\sigma_i\\,\\omega_i^2/g$; minus legs $M=\\{1,2,3\\}$, plus legs $P=\\{4,5,6\\}$."

final_formula:
  boxed: "$A_6=i\\,g^{-3}\\big(P_{\\text{pole}}+R_Q+R_0+R_q\\big)$  (full display in summary/SOLVED.md)"
  pieces:
    P_pole: >
      $-64\sum_{m,\{p,q\}:Q_{m;pq}>0}\dfrac{\omega_m\omega_tQ_{m;pq}^2}{d_{m;pq}}
      \mathcal H(\min(\omega_m^2,Q_{m;pq});p,q)\,\mathcal H(\min(\omega_t^2,Q_{m;pq});r,s)$,
      with $\mathcal H(B;c,d)=B-(B-\omega_c^2)_+-(B-\omega_d^2)_+ +(B-\omega_c^2-\omega_d^2)_+$
      (threshold = SUM OF SQUARES) and $d_{m;pq}=2(\omega_m+\omega_p)(\omega_m+\omega_q)$. 9 channels.
    R_Q: "$-32\\sum_{m,\\{p,q\\}}(Q_{m;pq})_+^3\\,\\omega_m\\omega_t$, $t=P\\setminus\\{p,q\\}$. 9 terms, order-3 $Q$-jump."
    R_0: "$H_0(u,v,e_-,e_+)$, 13 monomials; $u=\\sum_M\\omega,\\ v=e_2^-(M),\\ e_-=e_3^-,\\ e_+=e_3^+$. 1 global term."
    R_q: >
      $4\sum_{m,p}h_{mp}H_1(\omega_m,\omega_p,\omega_r+\omega_s,\omega_r\omega_s)
      +2\sum_{m,p,\phi}h_{r,\phi(r)}h_{s,\phi(s)}H_2(\omega_m,\omega_p,\omega_r+\omega_s,
      \omega_r\omega_s,\omega_r\omega_{\phi(r)}+\omega_s\omega_{\phi(s)})$, with
      $h_{mp}=(\omega_p^2-\omega_m^2)_+$; $\{r,s\}=M\setminus\{m\}$; $\phi$ the two bijections
      $M\setminus\{m\}\to P\setminus\{p\}$. 9 single-hinge + 18 matching terms. Order-1 $q$-jump.
  building_blocks: "3 seeds ($H_1{=}46$, $H_2{=}23$, $H_0{=}13$ = 82 monomials) + $\\mathcal H$-block + $(x)_+$. 0 chamber-specific coefficients."
  evaluator: "bots/pi/code/pi_r9_eval.py (PI, table-free, imports only fractions/itertools). Student: bots/student-1/code/round8_compact_candidate.py. Verifier: bots/verifier/code/vr8_core.py."

