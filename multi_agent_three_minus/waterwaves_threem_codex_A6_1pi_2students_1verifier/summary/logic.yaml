decomposition:
  id: D2_final
  statement: >
    $A_6=i\,g^{-3}(P_{\text{pole}}+R_Q+R_0+R_q)$. ALL FOUR PIECES PINNED AND TABLE-FREE.
    $R_{\text{spline}}=A_6/i-P_{\text{pole}}=R_0+R_q+R_Q$ is the denominator-free, degree-8,
    dual-$S_3$, continuous spline over the 18-wall fan; $R_Q$ carries the order-3 $Q$-jump, $R_q$
    the order-1 $q$-jump, $R_0$ is the smooth remainder.
  chamber_rule: >
    All chamber dependence via positive parts $h_{mp}=(\omega_p^2-\omega_m^2)_+$, $(Q_{m;pq})_+$,
    and $\min/(\cdot)_+$ inside $\mathcal H$. No flag/sort/table. Continuous across every wall.
  pole_rule: >
    Only denominators $d_{m;pq}=2(\omega_m+\omega_p)(\omega_m+\omega_q)$ in active ($Q>0$) channels;
    $d=0$ lies on the $\omega_p=-\omega_m$ sheet of $q_{mp}=0$ where the numerator vanishes (removable,
    two-sided limit). No genuine factorization pole in the probed interior ($D_S=0$ crossings finite).

