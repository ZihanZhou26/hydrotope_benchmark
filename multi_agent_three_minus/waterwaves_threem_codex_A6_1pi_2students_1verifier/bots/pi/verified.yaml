    round: 1
    timestamp: "2026-07-26T05:35:43"
    reason: >
      Round-1 foundation. No student/verifier candidate yet, so this is a
      harness sanity check the PI owns (toolchain + calibration + basic
      structural anchors), not a duplication of verifier work. Establishes
      trustworthy baseline facts for directing the students.
    method: >
      Copied bg.cpp to bots/pi/code and built it exactly per question.md
      (g++ -O2 -std=c++17 -o bg bg.cpp -lgmpxx -lgmp; build OK, GCC 8.5.0).
      Ran exact-rational BG for 5pt and 6pt three-minus samples.
    checks:
      - name: toolchain_build
        outcome: PASS
        detail: bg.cpp builds clean under g++ 8.5.0 with GMP.
      - name: 5pt_calibration_vs_two_minus_signflip
        outcome: PASS
        detail: >
          BG 5pt 3-minus (-w 2,3,4 -s -1,-1,-1,1,1) gives omega =
          {-14/3,2,3,4,-13/3}, A_5 = i*(-19968). Sign-flip maps 3-minus to
          two-minus with minus legs (4,5): A_5 = i*2^4*g^-2*omega_4*omega_5*
          sum_{S subset {1,2,3}} (-1)^|S| (beta^2 - sum_{j in S} omega_j^2)_+^2,
          beta = min(|omega_4|,|omega_5|) = 4. Nonzero terms:
          S=empty:+256, S={2}:-144, S={3}:-49, S={2,3}:+9 => sum 72.
          i*16*(-52/3)*72 = i*(-19968). EXACT match to BG.
      - name: degree8_homogeneity
        outcome: PASS
        detail: >
          6pt sample free (2,3,4,5) gives A_6 = i*(-9190656/7). Scaling all free
          freqs by 2 -> free (4,6,8,10) gives A_6 = i*(-2352807936/7) =
          256 * (-9190656/7) = 2^8 factor. A_6 is homogeneous of degree 8 in the
          frequencies at fixed g. (Two-minus template degree is 2n-4 = 8, so the
          three-minus A_6 shares the degree.)
      - name: plus_leg_permutation_symmetry
        outcome: PASS
        detail: >
          Swapping omega_4 <-> omega_5 (free (2,3,4,5) vs (2,3,5,4)) leaves
          A_6 = i*(-9190656/7) unchanged. A_6 is symmetric under permutations of
          the plus legs (expected to also hold for minus legs).
      - name: purely_imaginary
        outcome: PASS
        detail: A_6 real part is exactly 0 in all sampled three-minus points (A_6 = i * rational).
    anchors:
      - "omega={-8,2,3,4,5,-6}: A_6 = i*(-9190656/7)"
      - "omega={-154/17,3,5,2,7,-135/17}: A_6 = i*(-641893056/85)"
      - "5pt calib: omega={-14/3,2,3,4,-13/3}: A_5 = i*(-19968)"
    implication: >
      Truncated-cubic brick (.)_+^{n-3}=(.)_+^3 has degree 6, so with a
      two-minus-style outer prefactor the prefactor must be DEGREE 2 -- it cannot
      be the naive product omega_1*omega_2*omega_3 (degree 3). This rules out the
      most naive generalization and motivates the "sum over minus-leg pairs"
      ansatz assigned to student-1.

