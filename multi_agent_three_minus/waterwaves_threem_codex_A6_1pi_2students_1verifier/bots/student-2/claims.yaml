  - id: s2_010
    timestamp: "2026-07-26T15:09:43"
    status: verified_exact
    statement: >
      With the orientation
      $\Delta_{m;pq}R=R_{\rm spline}|_{Q_{m;pq}>0}
      -R_{\rm spline}|_{Q_{m;pq}<0}$, the order-three triple-wall
      brick is the compact nested spline
      $G_{m;pq}=-16\max(\omega_m^2,\omega_t^2)
      =-16[\omega_m^2+(\omega_t^2-\omega_m^2)_+]$, where
      $\{t\}=\{4,5,6\}\setminus\{p,q\}$. Hence the complete labeled
      orbit integrates as
      $R_Q=-16\sum_{m,p<q}(Q_{m;pq})_+^3
      [\omega_m^2+(q_{mt})_+]$. The brick is a degree-two spline
      only at the omitted-leg pair wall $q_{mt}=0$; it has no energy
      sign or further $Q$ selector.
