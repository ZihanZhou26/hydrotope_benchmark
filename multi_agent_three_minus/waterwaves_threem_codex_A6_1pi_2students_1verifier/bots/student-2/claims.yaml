  - id: s2_006
    timestamp: "2026-07-26T07:52:30"
    status: verified_with_open_prefactor
    statement: >
      For the compact nine-channel pole convention of claim $s1_003$,
      the polynomial remainder $R=A_6/i-P_{\rm pole}$ has a simple,
      nonzero pair-wall branch difference
      $R_L-R_R=q_{mp}H_{mp}$, where $H_{mp}$ is homogeneous of degree
