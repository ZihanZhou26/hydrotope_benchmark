      $H_{mp}$ are generated from one representative by
      $S_3(M)\times S_3(P)$, but their compact multivariate formula is
      not yet identified.
    evidence:
      - bots/student-2/derivations/s2_004_reduced_denominator_and_wall_bricks.md
      - bots/student-2/data/round2_exact.json
    verification: >
      Independent implementation of the compact pole formula made the
      primitive-scaled remainder integral at $750/750$ exact points.
      Three isolated $q_{24}$ paths gave exact polynomial branches, zero
      fit and holdout residuals on both sides, and wall multiplicity
      exactly one with nonzero coefficients
      $12622720/27$, $8178488960/6859$, and
      $30826928896/12167$. Before subtraction the jump was rational,
