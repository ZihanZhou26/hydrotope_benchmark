  - id: s2_007
    timestamp: "2026-07-26T09:59:49"
    status: verified_exact_ground_truth
    statement: >
      The pole-subtracted pair-wall coefficient is itself a spline:
      there is no single residual-$S_2\times S_2$ degree-six polynomial
      $H_{14}$ valid in every physical wall environment. In one exact
      environment the intrinsic branch difference is
      $R(q_{24}>0)-R(q_{24}<0)=q_{24}H_{24}$ with a primitive
      $29$-monomial degree-six polynomial. Its trace on $q_{14}=0$
      reduces to a five-block quartic times
      $\beta^2=\min_{j\notin\{m,p\}}\omega_j^2$, and the full
      29-term analytic piece itself reduces to three short defined
      blocks plus $q_{14}$ and $q_{14}^2$ corrections. A physical environment
      related by the non-primary minus swap $1\leftrightarrow3$ has the
      exact coefficient $H_{24}(w_3,w_2,w_1,w_4,w_5)\ne H_{24}(w)$;
      the coefficient of $w_1^5w_2$ in their difference is $-32$.
      Therefore the proposed single polynomial orbit
      $\sum_{m,p}(q_{mp})_+H_{mp}$ is incomplete.
    evidence:
      - bots/student-2/derivations/s2_007_exact_cell_brick_and_nested_verdict.md
      - bots/student-2/data/round3_context_a.json
      - bots/student-2/data/round3_context_b.json
      - bots/student-2/data/round3_context_c.json
      - bots/student-2/data/round3_context_comparison.json
    verification: >
      Six exact homogeneous quotient-ring interpolations used full-rank
      $285\times285$ systems, and all $120/120$ fresh exact BG holdouts
      had zero residual. Every pair-wall jump divided exactly by
      $q_{24}$, and the first recovered $H_{24}$ reproduced the prior
      exact wall value $12622720/27$. Isolated adjacent environments
      differing only at $q_{25}$ or $Q_{1;45}$ gave exactly the same
      normalized $H_{24}$, whereas the symmetry-related physical
      environment gave the unequal permuted polynomial. Both compact
      cell identities have zero symbolic residual. The same-energy
      $\beta$-trace formula passed $17/17$ distinct isolated wall
      environments and $102/102$ exact branch holdouts, with every
      possible non-primary minimizing leg represented. It also reduces
      symbolically to student-1's independent affine pieces
      $P(u)$ and $P(6-u)$ on the two sides of their exchange.
