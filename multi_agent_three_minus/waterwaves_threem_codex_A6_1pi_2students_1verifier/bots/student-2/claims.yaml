claims:
  - id: s2_001
    timestamp: "2026-07-26T05:54:13"
    status: verified_on_standard_sheet
    statement: >
      On the standard physical sheet with $\omega_2,\ldots,\omega_5>0$ and
      solved $\omega_1,\omega_6<0$, sort the six $|\omega_i|$ and record their
      momentum signs. The base chamber word is exactly one of
      $\{+-+--+,+--++-,+--+-+,+---++,-+++--,-++-+-,-++--+,-+-++-\}$.
      The word is invariant under the two $S_3$ label symmetries; its
      codimension-one changes are adjacent mixed-sign swaps
      $q_{mp}=\omega_p^2-\omega_m^2=0$.
    evidence:
      - bots/student-2/derivations/s2_001_chamber_geometry.md
    verification: >
      Analytic parametrization, strict dominance inequalities, prefix-sum
      exclusion, eight exact rational witnesses, exact conservation, and one
      exact GMP amplitude evaluation in every word. The same eight words were
      observed on other energy-sign sheets, but a sheet-independent proof is
      still needed.
  - id: s2_002
    timestamp: "2026-07-26T05:54:13"
    status: partially_verified
    statement: >
      Up to complements, all candidate subset walls are the two
      $S_3\times S_3$ orbits $q_{mp}=0$ and
      $q_{m;pq}=0$. Triple channels can carry a nonzero factorization residue
      only for $q_{m;pq}>0$. A fixed denominator supported by exact data is
      $\Delta=\prod_{m=1}^{3}\prod_{p=4}^{6}(\omega_m+\omega_p)$, making the
      cleared numerator homogeneous of degree $17$.
    evidence:
      - bots/student-2/derivations/s2_002_walls_poles_delta.md
    verification: >
      Exact propagator factorization and one-minus residue argument; exact
      denominator clearing at sixteen on-shell points including all eight
      words. Minimality of $\Delta$ is not proved.
  - id: s2_003
    timestamp: "2026-07-26T05:54:13"
    status: conjecture_with_exact_locus
    statement: >
      Every candidate zero $\omega_m+\omega_p=0$ of $\Delta$ forces the full
      six-point on-shell kinematics onto a three-pair cancellation locus.
      Multi-direction exact approaches show no divergence, suggesting that
      all apparent factorization poles are removable on shell.
    evidence:
      - bots/student-2/derivations/s2_002_walls_poles_delta.md
    verification: >
      The forced three-pair locus is proved algebraically. Four approach
