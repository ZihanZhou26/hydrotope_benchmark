  - id: s2_014
    timestamp: "2026-07-26T22:03:57"
    status: verified_symbolic
    statement: >
      On any physical pair wall $q_{mp}=0$, the two remaining minus
      squares and the two remaining plus squares have equal sums.
      Therefore their strict magnitude ordering has only two possible
      sector words, $\mathrm{MPPM}$ and $\mathrm{PMMP}$; the other four
      formal interleavings are impossible.  Moreover the old raw
      plus-minimum and minus-minimum cofactor templates obey
      $\left.(H^{(+)}-H^{(-)})\right|_{z=y}=32qJ(a,b,x,y)$, where the
      explicit 27-term quartic $J$ is displayed in the evidence file
      and is nonzero.  At
      $(a,b,x,y,z)=(2,4,13/2,-7/2,-7/2)$ it gives
      $J=-881/16$ and a mismatch $-21144$.  Thus those two raw
      templates cannot be joined unchanged by a continuous
      single-minimum truncated-power selector; a valid construction
      must redistribute their off-wall data through coupled wall
      terms.
    evidence:
      - bots/student-2/derivations/s2_014_round8_offwall_ground_truth_and_obstruction.md
    verification: >
      Cancelling the tied pair in exact momentum conservation proves
      equality of the two environment square sums, from which the two
      strict words follow by inequalities.  Direct symbolic expansion
      verifies the displayed cocycle identity exactly and evaluates
      its rational witness to $J=-881/16$ and
      $32(b^2-a^2)J=-21144$.  Fresh BG quotient extraction is pending
      separately and is not included in this claim.
