  - id: s2_004
    timestamp: "2026-07-26T07:52:30"
    status: verified
    statement: >
      On the six-point on-shell variety,
      $\Delta=\prod_{m\in M,p\in P}(\omega_m+\omega_p)=C^3$, where
      $C=e_3^-+e_3^+=\omega_1\omega_2\omega_3+
      \omega_4\omega_5\omega_6$. Moreover
      $\prod_{p\in P}(\omega_m+\omega_p)=C$ for every minus leg $m$, so
      every surviving channel obeys
      $1/d_T=(\omega_m+\omega_r)/(2C)$ with $r$ the omitted plus leg.
      The true generic reduced denominator is therefore
      $D_{\min}=C$ of degree $3$, and the reduced cleared numerator has
      homogeneous degree $11$.
    evidence:
      - bots/student-2/derivations/s2_004_reduced_denominator_and_wall_bricks.md
      - bots/student-2/data/round2_exact.json
    verification: >
      The cube and channel identities are analytic consequences of
      $e_1^+=-e_1^-$ and $e_2^+=e_2^-$. They passed exactly at $750$
      fresh BG points and $5079/5079$ active channels. On three
      single-cell affine paths, $C A_6/i$ was polynomial with nine exact
      holdouts total, while $\gcd(C A_6/i,C)=1$ over $\mathbb Q[t]$ on
      two paths (and a constant unit on the third), establishing
      minimality.
